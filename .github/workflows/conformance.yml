name: StarIntel conformance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, feat/operation-091, codex/starintel-0101-final-wire-closure]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate canonical schema lock
        run: |
          python3 scripts/sync-starintel-schema.py

      - name: Read canonical schema lock
        id: schema-lock
        run: echo "commit=$(jq -r .canonical_commit schema/starintel-legacy-schema.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned conformance source
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-gpt-auto-dig
          ref: ${{ steps.schema-lock.outputs.commit }}
          path: conformance-source

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable .
      - run: python -m pip install pytest build

      - name: Run Python tests
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source
        run: python -m pytest -q

      - name: Build and verify the installed wheel
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests/test_canonical.py"

      - name: Run Python fixture suite
        working-directory: conformance-source
        run: |
          python -m conformance.runner test \
            --producer python \
            --consumer python \
            --adapter "python=sh -c 'cd $GITHUB_WORKSPACE && python -m starintel_doc.conformance_adapter'"
