[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "starintel_doc"
version = "0.9.2"
authors = [
    {name = "nsaspy", email = "nsaspy@airmail.cc"},
]
description = "StarIntel 0.9.2 document parser with additive HTTP transaction and web-capture profile support"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Framework :: Starintel",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dataclasses-json",
    "jsonschema>=4.23,<5",
    "ulid-py",
]

[project.scripts]
starintel-conformance = "starintel_doc.conformance_adapter:main"
